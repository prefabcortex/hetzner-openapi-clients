# Generated by openapi-python-generator - do not edit by hand.

[project]
name = "hetzner-api"
version = "0.1.0"
description = "Strictly typed Python client (sync + async) for the Hetzner API"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.9.0",
    "httpx2>=2.14.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "griffe>=2.4.0",
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with `ruff format`
    "CPY001", # no copyright header
    "D107",   # __init__ is documented in the class docstring
    "TC001",  # pydantic reads annotations at runtime
    "TC002",
    "TC003",
    # API methods mirror the parameters of the API 1:1. Everything except path parameters is
    # keyword-only, so many arguments are not a design problem here.
    "PLR0913",
]

[tool.ruff.lint.flake8-builtins]
# Parameters are named like in the API (`type=`, `id=`), even if they shadow a builtin
builtins-ignorelist = ["format", "id", "type"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "PLR2004"]
# Examples print their results and use made-up tokens and passwords
"examples/**" = ["T201", "S105", "S106", "S107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["src", "tests", "examples"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_decorated = true
strict_bytes = true
local_partial_types = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
deprecateTypingAliases = true
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "error"
reportImportCycles = "error"
reportMissingSuperCall = "none"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true
addopts = ["-ra"]
filterwarnings = ["error"]
markers = ["live: read-only tests against the real API (skipped without a token)"]
# Tests are plain functions; imported models named "Test..." must not be collected
python_classes = []

[tool.coverage.run]
source = ["hetzner_api"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.poe.tasks]
"check:format" = { cmd = "ruff format --check .", help = "Is everything formatted?" }
"check:lint" = { cmd = "ruff check .", help = "Lint rules (all enabled)" }
"check:mypy" = { cmd = "mypy", help = "Types (mypy strict)" }
"check:pyright" = { cmd = "pyright", help = "Types (pyright strict)" }
test = { cmd = "pytest --cov", help = "Tests with 100 % branch coverage" }
"test:live" = { cmd = "pytest -m live", help = "Read-only tests against the real API (needs a token)" }
"check:api" = { cmd = "griffe check hetzner_api --search src", help = "Breaks in the public API since the last tag" }
check = { sequence = ["check:format", "check:lint", "check:mypy", "check:pyright", "test"], help = "Run all checks" }
